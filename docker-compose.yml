services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bunbunny
      POSTGRES_USER: bunbunny
      POSTGRES_PASSWORD: bunbunny
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunbunny -d bunbunny"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
